<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>
        Exemplo de Formulário
    </h1>

    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>
                Sexo
            </legend>

            <input type="radio" name="sexo" id="isxmas" value="M"> <label for="isxmas">Masculino</label> <br>

            <input type="radio" name="sexo" id="isxfem" value="F"> <label for="isxfem">Feminino</label> <br>
        </fieldset>

        <fieldset>
            <legend>
                Esportes favoritos
            </legend>

            <input type="checkbox" name="estkd" id="iestkd"> <label for="iestkd">Taekwondo</label> <br>

            <input type="checkbox" name="esmt" id="iesmt"> <label for="iesmt">Muay Thai</label> <br>

            <input type="checkbox" name="esbjj" id="iesbjj"> <label for="iesbjj">Jiu Jitsu</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
