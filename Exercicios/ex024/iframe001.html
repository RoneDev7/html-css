<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>
        Testando o uso de iframe
    </h1>

    <!--tamanho padrão do iframe e de 300x150px-->

    <p>
        Acessando o site do 
        
        <iframe src="https://onepiece.fandom.com/pt/wiki/One_Piece_Wiki" frameborder="0" height="300" width="500" scolling="no">           
        </iframe>
        
        para saber mais.
    </p>
    
    <p>
        O site do

        <iframe src="https://www.youtube.com" frameborder="0">
        <a href="https://www.youtube.com" target="_blank">youtube.com</a>
        </iframe>

        também é muito legal!
    </p>
</body>
</html>
